name: Publish

# Tag-driven and manual: pushing `v0.8.0` publishes exactly the commit the tag
# points at, which is what the plugin's `npx -y -p npm:@peri-code/hindsight@0.8.0`
# pins resolve to. Nothing here bumps a version — that is a commit, and the
# manifest tests are what keep it consistent across all four places.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by `npm publish --provenance`.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # Publish only what passed the same checks CI runs.
      - run: bun run verify

      - name: Check the tag matches the version being published
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Prove the spec the plugin pins actually resolves, and does so from outside
      # the checkout: `npm exec` matches a `<name>@<version>` spec against a local
      # `package.json` first, and this repository's own is exactly that spec — run
      # inside it, this would pass against the working tree even if the publish
      # failed. Registry propagation is not instant, hence the retries.
      #
      # This is the check `bun run verify` cannot make: every other test runs a
      # local tarball, so a publish that reports success while the version is not
      # resolvable leaves every installed plugin failing E404 on every hook, with
      # nothing red anywhere.
      - name: Smoke-test the published spec
        working-directory: ${{ runner.temp }}
        run: |
          name=$(node -p "require('$GITHUB_WORKSPACE/package.json').name")
          version=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          spec="$name@$version"
          for attempt in 1 2 3 4 5; do
            if npx --yes -p "$spec" hindsight --version; then
              echo "::notice::$spec resolves and runs"
              exit 0
            fi
            echo "::warning::$spec does not resolve yet (attempt $attempt)"
            sleep 20
          done
          echo "::error::$spec never resolved — an installed plugin would fail with E404 on every hook"
          exit 1
