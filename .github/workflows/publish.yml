name: Publish

# Tag-driven and manual: pushing `v0.8.0` publishes exactly the commit the tag
# points at, which is what the plugin's `npx -y -p @peri-code/hindsight@0.8.0`
# pins resolve to. Nothing here bumps a version — that is a commit, and the
# manifest tests are what keep it consistent across all four places.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by `npm publish --provenance`.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # Publish only what passed the same checks CI runs.
      - run: bun run verify

      - name: Check the tag matches the version being published
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
