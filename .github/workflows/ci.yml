name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Bun is the build/package tooling; Node is the runtime the plugin ships on.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

      # dist/ is not committed. The CLI tests and the MCP server tests both
      # spawn `dist/cli.js`, and the manifest tests compare the built version
      # against the plugin's pins, so this has to come before the test run.
      - run: bun run build
      - run: bun run test

      # What npm would actually publish, so a file that fell out of `files`
      # fails here rather than on a user's machine.
      - run: npm pack --dry-run
